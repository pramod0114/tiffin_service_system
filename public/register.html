<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TiffinExpress</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55525;
            --secondary: #2D6A4F;
            --dark: #0F172A;
            --gray-100: #F8FAFC;
            --gray-200: #E2E8F0;
            --gray-500: #64748B;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #FFF0EB 0%, #E8F5E9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        .register-card {
            background: white;
            padding: 2.5rem 2.2rem;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.08);
            border: 1px solid var(--gray-200);
            max-width: 480px;
            width: 100%;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--gray-500);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
        }
        .back-link:hover {
            color: var(--primary);
        }

        .register-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .register-header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--dark);
            margin: 0 0 0.3rem 0;
        }
        .register-header p {
            font-size: 0.9rem;
            color: var(--gray-500);
            margin: 0;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.35rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
        }

        .btn-register {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.6rem;
        }
        .btn-register:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .register-footer {
            text-align: center;
            font-size: 0.88rem;
            color: var(--gray-500);
            margin-top: 1.5rem;
        }
        .register-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
        .register-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
            font-size: 0.88rem;
            font-weight: 600;
        }
        .alert-error { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
        .alert-success { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
    </style>
</head>
<body>

    <div class="register-card">
        <a href="index.html" class="back-link">← Back to Home</a>

        <div class="register-header">
            <div style="font-size:3rem; margin-bottom:0.4rem;">🍱</div>
            <h1>Create Foodie Account</h1>
            <p>Start enjoying fresh homestyle meals today</p>
        </div>

        <div id="alertBox"></div>

        <form action="UserServlet" method="post" id="registerForm">
            <input type="hidden" name="action" value="register">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="10-digit mobile number" autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="address">Delivery Address (Hostel / Flat / Office)</label>
                <textarea id="address" name="address" rows="2" required placeholder="Building, Street, Area, City" autocomplete="street-address"></textarea>
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" name="password" required placeholder="Minimum 6 characters" autocomplete="new-password">
            </div>

            <button type="submit" class="btn-register" id="submitRegBtn">Create Account & Claim ₹350 Wallet Bonus</button>
        </form>

        <div class="register-footer">
            Already have an account? <a href="login.html">Log in here</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const success = urlParams.get('success');
        const alertBox = document.getElementById('alertBox');
        const registerForm = document.getElementById('registerForm');
        const submitRegBtn = document.getElementById('submitRegBtn');

        if (error) {
            alertBox.innerHTML = '<div class="alert alert-error">❌ ' + decodeURIComponent(error) + '</div>';
        }
        if (success) {
            alertBox.innerHTML = '<div class="alert alert-success">✅ ' + decodeURIComponent(success) + '</div>';
        }

        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!name || !email || !password) {
                alertBox.innerHTML = '<div class="alert alert-error">❌ Please fill all required fields</div>';
                return;
            }

            if (password.length < 6) {
                alertBox.innerHTML = '<div class="alert alert-error">❌ Password must be at least 6 characters long</div>';
                return;
            }

            submitRegBtn.disabled = true;
            submitRegBtn.textContent = 'Creating Account... ⏳';
            alertBox.innerHTML = '';

            fetch('UserServlet', {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'Accept': 'application/json'
                },
                body: new URLSearchParams({
                    action: 'register',
                    name: name,
                    email: email,
                    phone: phone,
                    address: address,
                    password: password
                })
            })
            .then(async r => {
                const data = await r.json().catch(() => ({ success: false, error: 'Registration error' }));
                if (r.ok && data.success) {
                    const userEmail = data.user?.email || email;
                    const token = data.token || userEmail;
                    localStorage.setItem('tiffin_token', token);
                    localStorage.setItem('tiffin_user_email', userEmail);
                    if (data.user) {
                        localStorage.setItem('tiffin_user_name', data.user.name || name);
                        localStorage.setItem('tiffin_user_phone', data.user.phone || phone);
                    }
                    alertBox.innerHTML = '<div class="alert alert-success">✅ Account created! Redirecting to your dashboard...</div>';
                    setTimeout(() => {
                        window.location.href = data.redirect || 'dashboard.html';
                    }, 250);
                } else {
                    submitRegBtn.disabled = false;
                    submitRegBtn.textContent = 'Create Account & Claim ₹350 Wallet Bonus';
                    alertBox.innerHTML = '<div class="alert alert-error">❌ ' + (data.error || 'Registration failed') + '</div>';
                }
            })
            .catch(() => {
                submitRegBtn.disabled = false;
                submitRegBtn.textContent = 'Create Account & Claim ₹350 Wallet Bonus';
                alertBox.innerHTML = '<div class="alert alert-error">❌ Network error. Please try again.</div>';
            });
        });
    </script>
</body>
</html>
