<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - TiffinExpress</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55525;
            --secondary: #2D6A4F;
            --dark: #0F172A;
            --gray-100: #F8FAFC;
            --gray-200: #E2E8F0;
            --gray-500: #64748B;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #FFF0EB 0%, #E8F5E9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        .login-card {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.08);
            border: 1px solid var(--gray-200);
            max-width: 440px;
            width: 100%;
            position: relative;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--gray-500);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--primary);
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .login-icon {
            font-size: 3rem;
            margin-bottom: 0.4rem;
        }
        .login-header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--dark);
            margin: 0 0 0.3rem 0;
        }
        .login-header p {
            font-size: 0.9rem;
            color: var(--gray-500);
            margin: 0;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1.5px solid var(--gray-200);
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary);
        }

        .btn-login {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .login-footer {
            text-align: center;
            font-size: 0.88rem;
            color: var(--gray-500);
            margin-top: 1.5rem;
        }
        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
            font-size: 0.88rem;
            font-weight: 600;
        }
        .alert-error { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
        .alert-success { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="index.html" class="back-link">← Back to Home</a>

        <div class="login-header">
            <div class="login-icon">🍱</div>
            <h1>Customer Login</h1>
            <p>Access your hot tiffin orders & subscriptions</p>
        </div>

        <div id="alertBox"></div>

        <form action="UserServlet" method="post" id="loginForm">
            <input type="hidden" name="action" value="login">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" id="submitBtn">Sign In to TiffinExpress</button>
        </form>

        <div style="background: #F8FAFC; border: 1px dashed #CBD5E1; border-radius: 12px; padding: 0.9rem; margin-top: 1.2rem; font-size: 0.82rem; color: #475569;">
            <div style="font-weight: 700; color: #1E293B; margin-bottom: 0.4rem; display: flex; align-items: center; justify-content: space-between;">
                <span>💡 Demo Registered Accounts</span>
                <span style="font-size: 0.75rem; color: #64748B;">Click to fill</span>
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button type="button" class="demo-fill-btn" onclick="fillCredentials('mahajanpramod442@gmail.com', 'password123')" style="background: white; border: 1px solid #CBD5E1; border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.78rem; font-weight: 600; cursor: pointer; color: #0F172A;">
                    👤 Pramod (mahajanpramod442@gmail.com)
                </button>
                <button type="button" class="demo-fill-btn" onclick="fillCredentials('rahul@example.com', 'password123')" style="background: white; border: 1px solid #CBD5E1; border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.78rem; font-weight: 600; cursor: pointer; color: #0F172A;">
                    👤 Rahul (rahul@example.com)
                </button>
            </div>
        </div>

        <div class="login-footer">
            Don't have an account? <a href="register.html">Sign up for free</a><br>
            <span style="display:inline-block; margin-top:0.4rem;">Kitchen Staff? <a href="admin-login.html" style="color:var(--secondary);">Admin Portal →</a></span>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const success = urlParams.get('success');
        const alertBox = document.getElementById('alertBox');
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        if (error) {
            alertBox.innerHTML = '<div class="alert alert-error">❌ ' + decodeURIComponent(error) + '</div>';
        }
        if (success) {
            alertBox.innerHTML = '<div class="alert alert-success">✅ ' + decodeURIComponent(success) + '</div>';
        }

        function fillCredentials(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
            alertBox.innerHTML = '<div class="alert alert-success" style="font-size:0.8rem; padding:0.5rem 0.8rem;">Filled credentials for ' + email + '. Click "Sign In" to authenticate.</div>';
        }

        function performLogin(email, password) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in... ⏳';
            alertBox.innerHTML = '';

            fetch('UserServlet', {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'Accept': 'application/json'
                },
                body: new URLSearchParams({
                    action: 'login',
                    email: email,
                    password: password
                })
            })
            .then(async r => {
                const data = await r.json().catch(() => ({ success: false, error: 'Server response error' }));
                if (r.ok && data.success) {
                    const userEmail = data.user?.email || email;
                    const token = data.token || userEmail;
                    localStorage.setItem('tiffin_token', token);
                    localStorage.setItem('tiffin_user_email', userEmail);
                    if (data.user) {
                        localStorage.setItem('tiffin_user_name', data.user.name || '');
                        localStorage.setItem('tiffin_user_phone', data.user.phone || '');
                    }
                    alertBox.innerHTML = '<div class="alert alert-success">✅ Signed in successfully! Redirecting...</div>';
                    setTimeout(() => {
                        window.location.href = data.redirect || 'dashboard.html';
                    }, 250);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In to TiffinExpress';
                    alertBox.innerHTML = '<div class="alert alert-error">❌ ' + (data.error || 'Invalid email or password') + '</div>';
                }
            })
            .catch(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In to TiffinExpress';
                alertBox.innerHTML = '<div class="alert alert-error">❌ Network error. Please try again.</div>';
            });
        }

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                alertBox.innerHTML = '<div class="alert alert-error">❌ Please enter both email and password</div>';
                return;
            }

            performLogin(email, password);
        });
    </script>
</body>
</html>
